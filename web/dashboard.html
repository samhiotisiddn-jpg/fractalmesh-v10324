<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRACTALMESH DASHBOARD v10332</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'JetBrains Mono',monospace;padding:20px}
h1{color:#d0f;border-bottom:2px solid #0ff;padding-bottom:10px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:#111;border:1px solid #333;border-radius:8px;padding:16px}
.card h2{color:#0ff;font-size:14px;margin-bottom:10px;text-transform:uppercase}
.card pre{background:#000;padding:10px;border-radius:4px;font-size:11px;color:#0f0;overflow:auto;max-height:220px;white-space:pre-wrap;word-break:break-all}
.status-ok{color:#0f0}.status-warn{color:#fa0}.status-err{color:#f55}
#apibadge{position:fixed;top:14px;right:20px;font-size:11px;opacity:.5}
</style>
</head>
<body>
<h1>FRACTALMESH DASHBOARD v10332</h1>
<span id="apibadge">API: <span id="apiH">offline</span></span>
<div class="grid">
  <div class="card"><h2>Agent Status</h2><pre id="agents">Loading...</pre></div>
  <div class="card"><h2>Revenue Ledger</h2><pre id="revenue">Loading...</pre></div>
  <div class="card"><h2>GNSS Hot</h2><pre id="gnss">Loading...</pre></div>
  <div class="card"><h2>Episodic Memory</h2><pre id="episodic">Loading...</pre></div>
</div>
<script>
const API = (location.protocol==='https:'?'https://':'http://') + location.hostname + ':7784';
async function api(path){const r=await fetch(API+path);if(!r.ok)throw new Error(r.status);return r.json()}
async function load(path,el){
  try{const d=await api(path);document.getElementById(el).textContent=JSON.stringify(d,null,2);
  }catch(e){document.getElementById(el).textContent='Error: '+e;}
}
api('/health').then(h=>{document.getElementById('apiH').textContent=h.db||'ok';document.getElementById('apiH').className='status-'+((h.db||'').includes('error')?'err':'ok')}).catch(()=>{document.getElementById('apiH').textContent='unreachable';document.getElementById('apiH').className='status-err'});
load('/api/agents','agents');
load('/api/revenue','revenue');
load('/api/gnss','gnss');
load('/api/episodic','episodic');
setInterval(()=>{load('/api/agents','agents');load('/api/revenue','revenue');load('/api/gnss','gnss');load('/api/episodic','episodic')},10000);
</script>
</body>
</html>
